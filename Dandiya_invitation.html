<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120a35">
<title>Mission Dandiya Partner 💃🪩</title>
<style>
:root{
  --midnight:#120a35; --purple:#4a1597; --magenta:#e0268f; --gold:#ffc83d;
  --orange:#ff7a1a; --teal:#18c9b4; --pink:#ff7ac8; --cream:#fff6e0; --ink:#2a1240;
  --font:"Baloo 2","Poppins","Trebuchet MS",ui-rounded,"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:var(--font);color:var(--cream);min-height:100vh;min-height:100dvh;background:var(--midnight);overflow-x:hidden}
.hide{display:none!important}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
[tabindex="-1"]:focus{outline:none}

/* ---------- Background ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
    radial-gradient(circle at 10% 6%,var(--magenta) 0,transparent 46%),
    radial-gradient(circle at 92% 18%,var(--orange) 0,transparent 38%),
    radial-gradient(circle at 85% 90%,var(--teal) 0,transparent 42%),
    radial-gradient(circle at 8% 88%,var(--pink) 0,transparent 40%),
    linear-gradient(160deg,var(--midnight) 0%,var(--purple) 50%,var(--midnight) 100%)}
.bg::before{content:"";position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;
  background:conic-gradient(from 0deg,var(--magenta),var(--orange),var(--gold),var(--teal),var(--purple),var(--pink),var(--magenta));
  opacity:.2;animation:spin 70s linear infinite}
.bg::after{content:"";position:absolute;inset:0;
  background-image:radial-gradient(circle,rgba(255,200,61,.22) 0 2px,transparent 3px),radial-gradient(circle,rgba(255,255,255,.12) 0 1.5px,transparent 2.5px);
  background-size:34px 34px,34px 34px;background-position:0 0,17px 17px}
.rays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;opacity:0;transition:opacity 1s;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.22) 0 8deg,transparent 8deg 24deg);animation:spin 40s linear infinite}
.party .rays{opacity:.5}
.star{position:absolute;border-radius:50%;background:#fff;width:var(--s);height:var(--s);left:var(--x);top:var(--y);opacity:0;animation:twinkle var(--d) ease-in-out infinite var(--delay)}
.floaty{position:absolute;bottom:-40px;left:var(--x);font-size:var(--fs);opacity:0;animation:rise var(--d) linear infinite var(--delay)}

/* ---------- Top decor: toran + fairy lights ---------- */
.decor{position:fixed;top:0;left:0;right:0;z-index:30;pointer-events:none}
.toran{display:flex;height:24px;border-top:4px solid var(--gold);background:rgba(18,10,53,.35)}
.toran i{flex:1;background:var(--c);clip-path:polygon(0 0,100% 0,50% 100%)}
.lights{position:relative;height:32px}
.lights svg{position:absolute;inset:0;width:100%;height:100%}
.bulb{position:absolute;left:var(--x);top:var(--y);width:9px;height:13px;border-radius:50% 50% 55% 55%;background:var(--c);
  box-shadow:0 0 8px 3px var(--c);transform:translate(-50%,0);animation:glow 1.6s ease-in-out infinite var(--delay)}
.party .bulb{animation-duration:.5s}
.garba{position:fixed;left:0;right:0;bottom:0;height:20px;z-index:30;pointer-events:none;
  background:
    linear-gradient(135deg,var(--gold) 25%,transparent 25%) -10px 0/20px 20px,
    linear-gradient(225deg,var(--pink) 25%,transparent 25%) -10px 0/20px 20px,
    linear-gradient(315deg,var(--teal) 25%,transparent 25%) 0 0/20px 20px,
    linear-gradient(45deg,var(--orange) 25%,transparent 25%) 0 0/20px 20px}

/* ---------- Floating stickers (background layer) ---------- */
.stickers{position:fixed;inset:0;z-index:2;pointer-events:none}
.sticker{position:absolute;left:var(--x);top:var(--y);animation:bob 4s ease-in-out infinite var(--delay)}
.sticker .face,.corner .face{display:inline-block;background:#fff;border:3px solid #fff;border-radius:16px;padding:5px 7px;font-size:34px;line-height:1;
  box-shadow:0 4px 0 rgba(0,0,0,.28),0 8px 18px rgba(0,0,0,.25)}
.face.txt{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-size:15px;font-weight:800;border-radius:999px;padding:7px 14px;white-space:nowrap}
.face svg{display:block}
.corner{position:absolute;z-index:3;pointer-events:none;transform:rotate(var(--r));animation:wiggle 3s ease-in-out infinite var(--delay)}
.corner .face{font-size:30px}
.corner.tl{top:-20px;left:-12px}
.corner.br{bottom:-20px;right:-12px}
.pop{position:fixed;z-index:70;pointer-events:none;font-size:26px;line-height:1;padding:5px;background:#fff;border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,.25)}

/* ---------- Controls ---------- */
.ctrl{position:fixed;top:8px;z-index:40;width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);
  background:rgba(18,10,53,.88);color:var(--cream);font-size:20px;display:grid;place-items:center;cursor:pointer;padding:0;font-family:inherit}
.ctrl:active{transform:scale(.92)}
#restartTop{left:10px}
#muteBtn{right:10px}

/* ---------- Layout ---------- */
.app{position:relative;z-index:10;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:92px 16px 52px}
.screen{display:none;width:100%;max-width:480px;margin:auto}
.screen.active{display:block;animation:pop .5s cubic-bezier(.2,1.3,.4,1)}
.card{position:relative;padding:24px 18px 26px;border-radius:28px;text-align:center;
  background:linear-gradient(180deg,rgba(44,14,100,.86),rgba(18,10,53,.9));
  border:2px solid var(--gold);box-shadow:0 0 0 5px rgba(255,200,61,.16),0 24px 50px rgba(0,0,0,.45)}
.card::before{content:"";position:absolute;inset:7px;border:1.5px dashed rgba(255,200,61,.45);border-radius:22px;pointer-events:none}
.card>*{position:relative}
.card>.corner{position:absolute}
h1,h2{margin:10px 0 8px;font-weight:800;line-height:1.12;color:var(--gold);text-shadow:0 3px 0 rgba(224,38,143,.85),0 0 18px rgba(255,200,61,.45)}
h1{font-size:clamp(28px,8vw,40px)}
h2{font-size:clamp(24px,6.6vw,32px)}
p{margin:8px 0;font-size:clamp(16px,4.4vw,19px);line-height:1.45}
.sub{font-weight:800;color:#fff;font-size:clamp(18px,5vw,22px)}
.pill{display:inline-block;padding:6px 16px;border-radius:999px;font-weight:800;font-size:16px;color:#fff;
  background:linear-gradient(90deg,var(--magenta),var(--orange));box-shadow:0 3px 0 rgba(0,0,0,.25)}

/* ---------- Buttons ---------- */
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:17px;width:100%;min-height:54px;padding:12px 22px;margin-top:14px;
  border-radius:999px;color:var(--ink);background:linear-gradient(180deg,#ffe27a,var(--gold) 55%,var(--orange));
  box-shadow:0 5px 0 #b8560b,0 10px 22px rgba(0,0,0,.35);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b8560b,0 4px 10px rgba(0,0,0,.3)}
.btn.alt{color:#fff;background:linear-gradient(180deg,#ff6fbd,var(--magenta));box-shadow:0 5px 0 #8a0f55,0 10px 22px rgba(0,0,0,.35)}
.btn.alt:active{box-shadow:0 1px 0 #8a0f55,0 4px 10px rgba(0,0,0,.3)}
.btn.ghost{color:var(--cream);background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.35);box-shadow:none}
.btn.ghost:active{transform:scale(.98)}
.btn.teal{color:var(--ink);background:linear-gradient(180deg,#7ff5e5,var(--teal));box-shadow:0 5px 0 #0b7d70,0 10px 22px rgba(0,0,0,.35)}

/* ---------- Quiz ---------- */
.dots{display:flex;gap:8px;justify-content:center;margin:4px 0 12px}
.dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.28);transition:.2s}
.dot.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.qtext{font-weight:800;font-size:clamp(18px,5vw,22px);color:#fff;margin:6px 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:56px;padding:10px 14px;border-radius:18px;
  border:2px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:var(--cream);font:inherit;font-weight:700;font-size:16.5px;line-height:1.3;cursor:pointer;transition:.15s}
.opt:active{transform:scale(.98)}
.opt .chip{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;background:var(--magenta)}
.opt:nth-child(2) .chip{background:var(--teal);color:var(--ink)}
.opt:nth-child(3) .chip{background:var(--orange)}
.opt:nth-child(4) .chip{background:var(--purple);border:2px solid var(--pink)}
.opt.picked{background:rgba(255,200,61,.22);border-color:var(--gold)}
.opt.dim{opacity:.42}
.bubble{margin:14px 0 2px;padding:12px 14px;border-radius:18px;background:var(--cream);color:var(--ink);font-weight:700;font-size:17px;line-height:1.35;animation:pop .35s}
.stamp{display:inline-block;margin:12px 0 6px;padding:10px 16px;border:3px solid var(--teal);color:#7ff5e5;border-radius:14px;
  font-weight:800;font-size:clamp(18px,5vw,24px);transform:rotate(-4deg);animation:stamp .55s cubic-bezier(.2,1.6,.4,1)}

/* ---------- Challenge ---------- */
.counter{font-weight:800;font-size:20px;color:#fff;margin:2px 0}
.stage{position:relative;display:block;width:100%;height:250px;margin:8px 0 4px;padding:0;color:inherit;font:inherit;cursor:pointer;overflow:hidden;
  border:2px dashed rgba(255,200,61,.55);border-radius:22px;background:radial-gradient(circle at 50% 72%,rgba(255,122,200,.32),transparent 65%)}
.stage:disabled{cursor:default}
.stick{position:absolute;bottom:12px;width:24px;height:190px;transform-origin:50% 100%;pointer-events:none;display:block;
  background:var(--stick) center/100% 100% no-repeat;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.stick.l{left:calc(50% - 72px);transform:rotate(-28deg)}
.stick.r{left:calc(50% + 48px);transform:rotate(28deg)}
.sparkpt{position:absolute;left:50%;top:64px;width:0;height:0;pointer-events:none}
.sp{position:absolute;left:0;top:0;font-size:18px;line-height:1;text-shadow:0 0 6px currentColor}
.ring{position:absolute;left:50%;top:64px;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:3px solid var(--gold);animation:ring 1.4s ease-out infinite;pointer-events:none}
.taphint{position:absolute;left:0;right:0;top:10px;font-weight:800;font-size:15px;color:var(--cream);opacity:.9;pointer-events:none}

/* ---------- Big question ---------- */
.drops{position:absolute;left:0;right:0;top:0;height:70px;pointer-events:none;overflow:hidden;border-radius:26px 26px 0 0}
.drop{position:absolute;top:0;left:var(--x);width:2px;height:var(--h);background:rgba(255,200,61,.65)}
.drop::after{content:"";position:absolute;bottom:-10px;left:50%;width:11px;height:14px;transform:translateX(-50%);border-radius:50% 50% 55% 55%;
  background:var(--c);box-shadow:0 0 10px 4px var(--c);animation:glow 1.4s ease-in-out infinite var(--delay)}
.hero{position:relative;display:flex;flex-direction:column;align-items:center;margin:4px 0 8px}
.hero.askhero{margin-top:34px}
.crossed{width:100px;margin-bottom:-4px;animation:bobsimple 3s ease-in-out infinite}
.crossed svg{display:block;width:100%;height:auto;filter:drop-shadow(0 0 10px rgba(255,200,61,.6))}
.couple{display:block;width:min(78%,250px);height:auto;transform-origin:50% 100%;animation:coupleSway 1.7s ease-in-out infinite alternate;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.typed{min-height:2.7em;font-weight:800;color:var(--gold);font-size:clamp(20px,5.6vw,26px);line-height:1.3;margin:6px 0}
.typed.typing::after{content:"▍";margin-left:2px;animation:blink .7s steps(1) infinite}
.bigq{font-weight:800;font-size:clamp(24px,7vw,32px);line-height:1.2;color:#fff;margin:10px 0;text-shadow:0 0 16px var(--pink)}
.warn{margin:12px 0 2px;padding:10px 12px;font-size:15px;line-height:1.4;border:1.5px dashed var(--teal);border-radius:14px;background:rgba(24,201,180,.14)}
.reveal{animation:pop .5s cubic-bezier(.2,1.3,.4,1)}

/* ---------- Win ---------- */
.winmsg{font-weight:700}
.final{font-weight:800;font-size:clamp(20px,5.6vw,26px);color:var(--gold);margin:10px 0}
.pass{margin:16px auto 6px;max-width:360px;border-radius:18px;background:var(--cream);color:var(--ink);text-align:left;padding:14px 16px;transform:rotate(-1.5deg);box-shadow:0 8px 0 rgba(0,0,0,.25);
  border-left:8px solid var(--magenta);border-right:8px solid var(--teal)}
.pass h3{margin:0 0 8px;font-size:17px;color:var(--magenta)}
.pass .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1.5px dashed rgba(42,18,64,.3);font-size:15px}
.pass .row span{opacity:.7}
.pass .row b{text-align:right}
.pass .note{margin-top:6px;padding-top:8px;border-top:1.5px dashed rgba(42,18,64,.3);font-size:13px;line-height:1.35;opacity:.85}
.small{font-size:14px;opacity:.85}

#confetti{position:fixed;inset:0;z-index:60;pointer-events:none}

/* ---------- Keyframes ---------- */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.95;transform:scale(1.3)}}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.9}90%{opacity:.9}100%{transform:translateY(-112vh) translateX(var(--dx)) rotate(360deg);opacity:0}}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-9px) rotate(calc(var(--r) + 4deg))}}
@keyframes wiggle{0%,100%{transform:rotate(var(--r))}50%{transform:rotate(calc(var(--r) + 7deg))}}
@keyframes bobsimple{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes coupleSway{from{transform:rotate(-2.5deg) translateY(0)}to{transform:rotate(2.5deg) translateY(-6px)}}
@keyframes pop{from{transform:scale(.92) translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes stamp{from{transform:scale(2.4) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes ring{from{transform:scale(.4);opacity:.9}to{transform:scale(2.2);opacity:0}}

@media (max-width:400px){
  .app{padding-left:12px;padding-right:12px}
  .card{padding:22px 14px 24px}
  .btn{font-size:16px}
  .opt{font-size:15.5px;padding:9px 12px}
  .sticker .face{font-size:26px}
  .face.txt{font-size:13px}
  .couple{width:min(80%,220px)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>

<!-- ============================ BACKGROUND ============================ -->
<div class="bg" aria-hidden="true"><div class="rays"></div><div id="particles"></div></div>
<div class="stickers" id="stickers" aria-hidden="true"></div>
<div class="decor" aria-hidden="true"><div class="toran" id="toran"></div><div class="lights" id="lights"></div></div>
<div class="garba" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<button class="ctrl" id="restartTop" type="button" aria-label="Restart game" title="Restart">↺</button>
<button class="ctrl" id="muteBtn" type="button" aria-label="Mute sound" aria-pressed="false" title="Sound">🔊</button>

<noscript><p style="position:relative;z-index:20;padding:90px 20px;text-align:center">Is game ko chalane ke liye JavaScript ON karna padega 🙏</p></noscript>

<main class="app">

  <!-- SCREEN 1 -->
  <section id="s-intro" class="screen active">
    <div class="card">
      <div class="pill" data-t="intro.greeting"></div>
      <div class="hero" data-hero></div>
      <h1 data-t="intro.title"></h1>
      <p class="sub" data-t="intro.sub"></p>
      <p data-t="intro.body"></p>
      <button class="btn" id="startBtn" type="button" data-t="intro.button"></button>
    </div>
  </section>

  <!-- SCREEN 2 -->
  <section id="s-quiz" class="screen">
    <div class="card">
      <h2 data-t="quiz.header"></h2>
      <div class="dots" id="qDots"></div>
      <div id="qBox">
        <p class="qtext" id="qText"></p>
        <div class="opts" id="qOpts"></div>
        <div class="bubble hide" id="qReply" aria-live="polite"></div>
        <button class="btn alt hide" id="qNext" type="button"></button>
      </div>
      <div id="qDone" class="hide">
        <div class="stamp" data-t="quiz.passed"></div>
        <p class="sub" data-t="quiz.teaser"></p>
        <button class="btn" id="unlockBtn" type="button" data-t="quiz.unlock"></button>
      </div>
    </div>
  </section>

  <!-- SCREEN 3 -->
  <section id="s-challenge" class="screen">
    <div class="card">
      <h2 data-t="challenge.title"></h2>
      <p data-t="challenge.hint"></p>
      <div class="counter" id="hitCount" aria-live="polite"></div>
      <div class="dots" id="hitDots"></div>
      <button class="stage" id="stage" type="button" aria-label="Dandiya sticks ko tap karo">
        <span class="taphint" data-t="challenge.tapLabel"></span>
        <span class="ring" id="ring"></span>
        <span class="stick l" id="stickL"></span>
        <span class="stick r" id="stickR"></span>
        <span class="sparkpt" id="sparkPt"></span>
      </button>
      <div id="chDone" class="hide">
        <div class="bubble" data-t="challenge.done"></div>
        <button class="btn" id="chNext" type="button" data-t="challenge.button"></button>
      </div>
    </div>
  </section>

  <!-- SCREEN 4 -->
  <section id="s-ask" class="screen">
    <div class="card">
      <div class="drops" id="drops"></div>
      <div class="hero askhero" data-hero="sticks"></div>
      <div class="typed" id="askType" aria-live="polite"></div>
      <div class="bigq hide" id="askBig" data-t="ask.big"></div>
      <div class="warn hide" id="askWarn" data-t="ask.warn"></div>
      <div class="hide" id="askBtns">
        <button class="btn" id="askYes" type="button" data-t="ask.yes"></button>
        <button class="btn ghost" id="askNo" type="button" data-t="ask.no"></button>
      </div>
      <div class="hide" id="decline">
        <div class="bubble" data-t="ask.declineReply"></div>
        <div id="dOpts"></div>
        <div class="hide" id="dAfter">
          <div class="bubble" id="dReply"></div>
          <button class="btn" id="askYes2" type="button" data-t="ask.yes"></button>
          <button class="btn ghost" id="askSoft" type="button" data-t="ask.soft"></button>
          <div class="bubble hide" id="softNote"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- SUCCESS -->
  <section id="s-win" class="screen">
    <div class="card">
      <div class="hero" data-hero></div>
      <h1 data-t="win.title"></h1>
      <p class="winmsg" data-t="win.msg"></p>
      <div class="final" data-t="win.final"></div>
      <div class="pass" id="pass"></div>
      <p class="small" data-t="win.screenshot"></p>
      <button class="btn teal" id="againBtn" type="button" data-t="win.restart"></button>
    </div>
  </section>

</main>

/* ---------- sound (Web Audio, fully optional) ---------- */
let AC = null, muted = !C.soundOn;
function ac(){
  if (muted) return null;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch(e){ AC = null; }
  return AC;
}
function tone(f,d,type,v,delay,to){
  const a = ac(); if(!a) return;
  try{
    const t=a.currentTime+(delay||0), o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(to) o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v||.1,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+.03);
  }catch(e){}
}
const sfx = {
  click(){ tone(520,.09,'triangle',.1,0,780); },
  pick(){ tone(660,.09,'sine',.12); tone(880,.12,'sine',.1,.07); },
  hit(n){ tone(900,.09,'square',.06,0,300); tone(480+n*110,.2,'triangle',.12,.02); tone(1500,.1,'sine',.05,.03); },
  win(){ [523,659,784,1046].forEach((f,i)=>tone(f,.24,'triangle',.12,i*.09)); },
  chime(){ tone(988,.2,'sine',.1); tone(1319,.32,'sine',.08,.1); }
};
function setMuteUI(){
  const b=$('#muteBtn'); b.textContent = muted ? '🔇' : '🔊';
  b.setAttribute('aria-pressed', String(muted));
  b.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
}
$('#muteBtn').addEventListener('click', ()=>{ muted=!muted; setMuteUI(); if(!muted) sfx.click(); });

/* ---------- decor: toran, fairy lights, stars, floaters, stickers ---------- */
(function buildDecor(){
  const bulbCols = [P.gold,P.pink,P.teal,P.orange,'#ffffff','#a58bff'];
  const flagCols = [P.magenta,P.gold,P.teal,P.orange,P.pink,'#7cf3ff'];
  $('#toran').innerHTML = Array.from({length:16},(_,i)=>`<i style="--c:${flagCols[i%flagCols.length]}"></i>`).join('');
  let h = `<svg viewBox="0 0 100 20" preserveAspectRatio="none"><path d="M0 2 Q12.5 18 25 2 Q37.5 18 50 2 Q62.5 18 75 2 Q87.5 18 100 2" fill="none" stroke="rgba(255,200,61,.75)" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
  let k = 0;
  for (let s=0;s<4;s++) for (const t of [.2,.5,.8]) {
    const x = 25*(s+t), y = (2+32*t*(1-t))*1.5;
    h += `<i class="bulb" style="--x:${x}%;--y:${y}px;--c:${bulbCols[k%bulbCols.length]};--delay:${(k*0.17).toFixed(2)}s"></i>`; k++;
  }
  $('#lights').innerHTML = h;

  let p = '';
  for (let i=0;i<28;i++) p += `<span class="star" style="--x:${rnd(0,100).toFixed(1)}%;--y:${rnd(0,100).toFixed(1)}%;--s:${rnd(2,5).toFixed(1)}px;--d:${rnd(2.5,5).toFixed(1)}s;--delay:${rnd(0,5).toFixed(1)}s"></span>`;
  const fl = ['✨','🌼','⭐','🪔','🌸'];
  for (let i=0;i<12;i++) p += `<span class="floaty" style="--x:${rnd(0,96).toFixed(1)}%;--fs:${rnd(14,26).toFixed(0)}px;--d:${rnd(11,20).toFixed(1)}s;--delay:${rnd(0,12).toFixed(1)}s;--dx:${rnd(-60,60).toFixed(0)}px">${fl[i%fl.length]}</span>`;
  $('#particles').innerHTML = p;

  $('#stickers').innerHTML = C.stickers.map((s,i)=>{
    const inner = s.kind==='sticks' ? `<span class="face">${crossedSticks(74)}</span>`
      : s.kind==='text' ? `<span class="face txt" style="--c1:${s.c1};--c2:${s.c2}">${s.t}</span>`
      : `<span class="face">${s.t}</span>`;
    return `<div class="sticker" style="--x:${s.x};--y:${s.y};--r:${s.r}deg;--delay:${(i*0.45).toFixed(2)}s">${inner}</div>`;
  }).join('');

  // corner stickers peeking out of each card
  Object.keys(C.cornerStickers).forEach(id=>{
    const card = document.querySelector('#'+id+' .card'); if(!card) return;
    const [a,b] = C.cornerStickers[id];
    card.insertAdjacentHTML('beforeend',
      `<span class="corner tl" style="--r:-12deg;--delay:0s"><span class="face">${a}</span></span>
       <span class="corner br" style="--r:10deg;--delay:.6s"><span class="face">${b}</span></span>`);
  });
  $('#drops').innerHTML = Array.from({length:9},(_,i)=>`<i class="drop" style="--x:${((i+.5)/9*100).toFixed(1)}%;--h:${16+(i%3)*14}px;--c:${bulbCols[i%bulbCols.length]};--delay:${(i*.2).toFixed(1)}s"></i>`).join('');
})();

/* ---------- sticker pop + sparks ---------- */
function popStickers(x,y,n){
  if (reduce) return;
  for (let i=0;i<(n||6);i++){
    const s = document.createElement('div'); s.className='pop';
    s.textContent = C.popEmoji[Math.floor(Math.random()*C.popEmoji.length)];
    s.style.left = x+'px'; s.style.top = y+'px';
    document.body.appendChild(s);
    const dx = rnd(-120,120), dy = -rnd(90,210), rot = rnd(-35,35);
    const anim = s.animate([
      {transform:'translate(-50%,-50%) scale(.3) rotate(0deg)',opacity:1},
      {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(1.1) rotate(${rot}deg)`,opacity:1,offset:.7},
      {transform:`translate(calc(-50% + ${dx*1.1}px),calc(-50% + ${dy-30}px)) scale(1) rotate(${rot}deg)`,opacity:0}
    ],{duration:rnd(900,1300),easing:'cubic-bezier(.2,.8,.3,1)'});
    anim.onfinish = () => s.remove();
  }
}
function popFrom(el,n){ const r=el.getBoundingClientRect(); popStickers(r.left+r.width/2, r.top+r.height/2, n); }
function popCenter(n){ popStickers(innerWidth/2, innerHeight*0.45, n); }

function sparks(){
  if (reduce) return;
  const pt = $('#sparkPt'), cols=[P.gold,P.pink,P.teal,P.orange,'#fff'], chars=['✦','✧','★','•'];
  for (let i=0;i<16;i++){
    const s = document.createElement('span'); s.className='sp'; s.textContent=chars[i%4]; s.style.color=cols[i%5];
    pt.appendChild(s);
    const a = rnd(0,Math.PI*2), d = rnd(40,105);
    s.animate([
      {transform:'translate(-50%,-50%) scale(.4)',opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) scale(1.3)`,opacity:0}
    ],{duration:rnd(600,950),easing:'ease-out'}).onfinish = () => s.remove();
  }
}

/* ---------- confetti (canvas) ---------- */
const cv = $('#confetti'), g = cv.getContext('2d');
let W=0,H=0,parts=[],raf=0;
function sizeCv(){ const d=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*d; cv.height=H*d; g.setTransform(d,0,0,d,0,0); }
addEventListener('resize', sizeCv); sizeCv();
const confCols = () => [P.gold,P.magenta,P.teal,P.orange,P.pink,'#ffffff','#7cf3ff'];
function spawn(n,x,y,vxDir,rain){
  const cols = confCols();
  for (let i=0;i<n;i++){
    parts.push({
      x: rain ? rnd(0,W) : x, y: rain ? -10 : y,
      vx: rain ? rnd(-1.2,1.2) : vxDir*rnd(2,8)+rnd(-2,2),
      vy: rain ? rnd(1,3) : -rnd(9,18),
      w: rnd(6,12), h: rnd(8,15), r: rnd(0,6.28), vr: rnd(-.3,.3),
      c: cols[Math.floor(Math.random()*cols.length)], round: Math.random()<.25
    });
  }
  if (!raf) raf = requestAnimationFrame(step);
}
function step(){
  g.clearRect(0,0,W,H);
  for (const p of parts){
    p.vy += .28; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle = p.c;
    if (p.round){ g.beginPath(); g.arc(0,0,p.w/2,0,6.28); g.fill(); } else g.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    g.restore();
  }
  parts = parts.filter(p => p.y < H+30);
  if (parts.length) raf = requestAnimationFrame(step); else { raf = 0; g.clearRect(0,0,W,H); }
}
function stopConfetti(){ parts=[]; cancelAnimationFrame(raf); raf=0; g.clearRect(0,0,W,H); }
function celebrate(){
  if (reduce) return;
  const cannons = () => { spawn(70,W*.08,H*.95,1); spawn(70,W*.92,H*.95,-1); };
  cannons(); later(()=>spawn(70,0,0,0,true),500); later(cannons,1200); later(()=>spawn(80,0,0,0,true),1900); later(cannons,2800);
}

/* ---------- typewriter ---------- */
function typeText(el,text,speed){
  return new Promise(res=>{
    if (reduce){ el.textContent=text; return res(); }
    const ch = Array.from(text); let i=0; el.textContent='';
    (function tick(){ i++; el.textContent = ch.slice(0,i).join(''); if (i<ch.length) later(tick,speed); else res(); })();
  });
}
const reveal = sel => { const el=$(sel); el.classList.remove('hide'); el.classList.remove('reveal'); void el.offsetWidth; el.classList.add('reveal'); };

/* ---------- navigation ---------- */
const inits = {};
function go(id){
  clearTimers(); stopConfetti(); document.body.classList.remove('party');
  $$('.screen').forEach(s => s.classList.toggle('active', s.id===id));
  window.scrollTo(0,0);
  if (inits[id]) inits[id]();
  const h = document.querySelector('#'+id+' h1, #'+id+' h2');
  if (h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); }
}

/* ---------- SCREEN 2: quiz ---------- */
let qi = 0, answered = false;
function renderQ(){
  const Q = C.quiz.questions, q = Q[qi]; answered = false;
  $('#qDots').innerHTML = Q.map((_,i)=>`<span class="dot ${i<=qi?'on':''}"></span>`).join('');
  $('#qText').textContent = T(q.q);
  const box = $('#qOpts'); box.innerHTML = '';
  q.options.forEach((o,i)=>{
    const b = document.createElement('button'); b.type='button'; b.className='opt';
    b.innerHTML = `<span class="chip">${'ABCD'[i]}</span><span></span>`;
    b.lastChild.textContent = T(o.t);
    b.addEventListener('click', ()=>choose(b,o));
    box.appendChild(b);
  });
  $('#qReply').classList.add('hide'); $('#qNext').classList.add('hide');
  $('#qBox').classList.remove('hide'); $('#qDone').classList.add('hide');
}
function choose(b,o){
  if (answered) return; answered = true;
  sfx.pick();
  $$('#qOpts .opt').forEach(x => x.classList.add(x===b ? 'picked' : 'dim'));
  const r = $('#qReply'); r.textContent = T(o.r); r.classList.remove('hide');
  r.style.animation='none'; void r.offsetWidth; r.style.animation='';
  const n = $('#qNext'); n.textContent = T(qi===C.quiz.questions.length-1 ? C.quiz.last : C.quiz.next); n.classList.remove('hide');
  popFrom(b,5);
  n.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});
}
$('#qNext').addEventListener('click', ()=>{
  sfx.click();
  if (qi < C.quiz.questions.length-1){ qi++; renderQ(); }
  else {
    $('#qBox').classList.add('hide'); $('#qDone').classList.remove('hide');
    $('#qDots').innerHTML = C.quiz.questions.map(()=>'<span class="dot on"></span>').join('');
    sfx.win(); popCenter(8);
  }
});
inits['s-quiz'] = () => { qi = 0; renderQ(); };

/* ---------- SCREEN 3: dandiya challenge ---------- */
let hits = 0;
const stage = $('#stage');
function renderHits(){
  const n = C.challenge.total;
  $('#hitCount').textContent = C.challenge.counter.replace('{n}',hits).replace('{total}',n);
  $('#hitDots').innerHTML = Array.from({length:n},(_,i)=>`<span class="dot ${i<hits?'on':''}"></span>`).join('');
}
inits['s-challenge'] = () => {
  hits = 0; stage.disabled = false;
  $('#chDone').classList.add('hide'); $('#ring').classList.remove('hide');
  renderHits();
};
stage.addEventListener('click', ()=>{
  const total = C.challenge.total;
  if (hits >= total) return;
  hits++; renderHits(); sfx.hit(hits); $('#ring').classList.add('hide');
  if (!reduce){
    $('#stickL').animate([{transform:'rotate(-28deg)'},{transform:'rotate(24deg)',offset:.45},{transform:'rotate(-28deg)'}],{duration:340,easing:'ease-in-out'});
    $('#stickR').animate([{transform:'rotate(28deg)'},{transform:'rotate(-24deg)',offset:.45},{transform:'rotate(28deg)'}],{duration:340,easing:'ease-in-out'});
    later(sparks,150);
  }
  if (hits === total){
    stage.disabled = true;
    later(()=>{ $('#chDone').classList.remove('hide'); reveal('#chDone'); sfx.win(); popFrom(stage,8); $('#chNext').scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'}); }, 550);
  }
});

/* ---------- SCREEN 4: the big question ---------- */
inits['s-ask'] = () => {
  ['#askBig','#askWarn','#askBtns','#decline','#dAfter','#softNote'].forEach(s=>$(s).classList.add('hide'));
  $('#dOpts').classList.remove('hide'); $('#dOpts').innerHTML = '';
  const el = $('#askType'); el.textContent=''; el.classList.add('typing');
  typeText(el, T(C.ask.typed), 55).then(()=>{
    el.classList.remove('typing');
    later(()=>{ reveal('#askBig'); sfx.chime();
      later(()=>{ reveal('#askWarn');
        later(()=>{ reveal('#askBtns'); $('#askBtns').scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'}); }, 600);
      }, 800);
    }, 1000);
  });
};
$('#askNo').addEventListener('click', ()=>{
  sfx.pick();
  $('#askBtns').classList.add('hide');
  const box = $('#dOpts'); box.innerHTML = '';
  C.ask.declineOptions.forEach((o,i)=>{
    const b = document.createElement('button'); b.type='button'; b.className = 'btn ' + (i===0 ? 'alt' : 'ghost'); b.textContent = T(o.t);
    b.addEventListener('click', ()=>{
      sfx.pick(); $('#dOpts').classList.add('hide');
      $('#dReply').textContent = T(o.r);
      reveal('#dAfter'); popFrom(b,4);
      $('#askYes2').scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});
    });
    box.appendChild(b);
  });
  reveal('#decline');
});
$('#askSoft').addEventListener('click', ()=>{
  sfx.click(); $('#softNote').textContent = T(C.ask.softReply); reveal('#softNote'); $('#askSoft').classList.add('hide');
});
const accept = () => { sfx.click(); go('s-win'); };
$('#askYes').addEventListener('click', accept);
$('#askYes2').addEventListener('click', accept);

/* ---------- SUCCESS ---------- */
(function buildPass(){
  const p = C.win.pass;
  $('#pass').innerHTML = `<h3></h3>` + p.rows.map(()=>`<div class="row"><span></span><b></b></div>`).join('') + `<div class="note"></div>`;
  $('#pass h3').textContent = T(p.title);
  $$('#pass .row').forEach((r,i)=>{ r.children[0].textContent = T(p.rows[i][0]); r.children[1].textContent = T(p.rows[i][1]); });
  $('#pass .note').textContent = T(p.note);
})();
inits['s-win'] = () => {
  document.body.classList.add('party');
  sfx.win(); celebrate(); later(()=>popCenter(10),300);
};

/* ---------- buttons: start / unlock / next / restart ---------- */
$('#startBtn').addEventListener('click', ()=>{ sfx.click(); go('s-quiz'); });
$('#unlockBtn').addEventListener('click', ()=>{ sfx.click(); go('s-challenge'); });
$('#chNext').addEventListener('click', ()=>{ sfx.click(); go('s-ask'); });
function restart(){ qi = 0; hits = 0; answered = false; go('s-intro'); }
$('#restartTop').addEventListener('click', restart);
$('#againBtn').addEventListener('click', restart);
})();
</script>
